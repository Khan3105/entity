[simulation]
  name    = "KAW2D_046"
  engine  = "srpic"
  runtime = 75000.0

  [simulation.domain]
  decomposition = [16,1]

[grid]
  resolution = [848, 848]
  extent     = [[-140.0, 140.0], [-140.0, 140.0]]

  [grid.metric]
    metric = "minkowski"

  [grid.boundaries]
    fields    = [["PERIODIC"], ["PERIODIC"]]
    particles = [["PERIODIC"], ["PERIODIC"]]

[scales]
  larmor0    = 0.7071067811865476
  skindepth0 = 0.7071067811865476

[algorithms]
  current_filters = 16

  [algorithms.timestep]
    CFL = 0.95

[particles]
  ppc0 = 8000.0
  spatial_sorting_interval = 6000
  use_weights = false

  [[particles.species]]
    label    = "e-"
    mass     = 1.0
    charge   = -1.0
    maxnpart = 3.0e8

  [[particles.species]]
    label    = "i+"
    mass     = 25.0
    charge   = 1.0
    maxnpart = 3.0e8

[setup]
  multimode = false
  n_modes = 3             # Shell radius
  seed = 66
  mm_direction = 0        # 0 = all, 1 = parallel only (ky=0), 2 = perp only (kx=0)
  kx = 3.0                # Number of wavelengths in Lx, only for Single Mode atm!
  betai0 = 0.5
  betae0 = 0.5
  Bmaxmin_ratio = 2.0
  h = 0.2
  r = 10.0
  cAi0 = 0.02

  # --- on-the-fly velocity distribution functions (see vdf_output.hpp) ---
  # writes <simulation.name>/vdf/vdf.<step>.npy, read with plot_vdf.py
  vdf_enable        = true
  vdf_interval_time = 700.0           # output cadence (default: same as the fields)
  vdf_nbins         = 64              # bins per velocity axis, full 3D grid of nbins^3 bins
                                      # file size per species and box: 64 -> 1.05 MB, 96 -> 3.5 MB, 128 -> 8.4 MB
  vdf_vmax          = [4.0, 4.0]      # velocity grid is +/- vmax * v_th, for (e-, i+)
  # boxes: [x_centre, y_centre, width_x, width_y] in grid units, write all values as floats
  vdf_boxes = [
    [0.0,   0.0, 4.0, 4.0],
    [0.0,  60.0, 4.0, 4.0],
    [0.0,  80.0, 4.0, 4.0],
    [0.0, 100.0, 4.0, 4.0],
  ]

[checkpoint]
  interval_time = 10400.0
  walltime = "47:45:00"
  keep = 2

[output]
  format        = "BPFile"
  interval_time = 700.0

  [output.fields]
    quantities = ["N_1", "N_2", "V_1", "V_2", "B", "E", "J", "Tij_1", "Tij_2"]

  [output.particles]
    enable = false

  [output.spectra]
    enable = true

  [output.stats]
    enable = true
    quantities = ["N", "J.E", "E^2", "B^2", "Charge", "Tii"]

[diagnostics]
  interval = 1563
  log_level = "INFO"
  colored_stdout = false
  blocking_timers = false

